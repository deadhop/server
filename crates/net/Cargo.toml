[package]
name = "deadhop-net"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Nostr relay transport for deadhop services: proxies, per-relay routing, a first-accept relay pool and host classifiers"
license = "MIT"
publish = false

[features]
# Stand-in proxies for the tests of the services that use this crate.
# Enabled only from dev-dependencies; never part of a release build.
test-support = []

[dependencies]
async-trait = "0.1"
# The relay library's websocket message type (same version it uses).
async-wsocket = { version = "=0.13.2", default-features = false }
base64 = "0.22"
contextvm-sdk = "0.2.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
nostr-sdk = "0.44"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-socks = "0.5"
# Same version as the relay library uses, so its websocket message type is shared.
tokio-tungstenite = { version = "=0.26.2", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
webpki-roots = "0.26"

[dev-dependencies]
nostr-relay-builder = "0.44"
serde_json = "1"
