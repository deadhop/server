[package]
name = "deadhop-netengine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Network engine for deadhop services: network settings and lanes, routing rules, the proxy pool, relay health, I2P names, the privacy audit"
license = "MIT"
publish = false

[features]
# Short timeouts and a stand-in I2P router, for the tests of the services
# that use this crate. Enabled only from dev-dependencies; never part of a
# release build.
test-support = []

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bitcoin = { version = "0.32", default-features = false, features = ["std"] }
deadhop-cvm = { path = "../cvm" }
deadhop-net = { path = "../net" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.2"
hex = "0.4"
nostr-sdk = "0.44"
rmcp = { version = "1.8", features = ["server", "macros", "transport-worker"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-socks = "0.5"
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
deadhop-net = { path = "../net", features = ["test-support"] }
nostr-relay-builder = "0.44"
rmcp = { version = "1.8", features = ["server", "client", "macros", "transport-worker", "transport-async-rw"] }
tempfile = "3"
# Same version as the relay library uses, so its websocket message type is shared.
tokio-tungstenite = { version = "=0.26.2", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

# rmcp 1.8.0 with the response-task reaping fix backported from rmcp 3.x
# (#46). Drop when contextvm-sdk moves to rmcp 3.x.
[patch.crates-io]
rmcp = { path = "../../vendor/rmcp" }
