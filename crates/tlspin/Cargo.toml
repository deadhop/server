[package]
name = "deadhop-tlspin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "TLS client verification by pinned certificate fingerprint (rustls)"
license = "MIT"
publish = false

[dependencies]
bitcoin = { version = "0.32", default-features = false, features = ["std"] }
hex = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
